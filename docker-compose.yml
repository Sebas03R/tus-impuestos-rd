# Entorno local de Tus Impuestos RD.
# Postgres 17 (igual que Supabase) + pipeline Python + web Next.js.
# Uso rápido: `docker compose up -d db` y luego correr pipeline/web desde el host.
name: tus-impuestos-rd

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tirds}
      POSTGRES_USER: ${POSTGRES_USER:-tirds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tirds_local_only}
    ports:
      - "${DB_PORT:-54330}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tirds} -d ${POSTGRES_DB:-tirds}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: .
      dockerfile: infrastructure/docker/pipeline.Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tirds}:${POSTGRES_PASSWORD:-tirds_local_only}@db:5432/${POSTGRES_DB:-tirds}
      APP_ENV: ${APP_ENV:-development}
      SYNC_SINCE: ${SYNC_SINCE:-2025-01-01}
    command: ["tirds", "run-scheduled"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_WEB: postgres://web_app:${WEB_APP_DB_PASSWORD:-web_app_local_only}@db:5432/${POSTGRES_DB:-tirds}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-local-only-32-characters-min}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  db-data:
