name: Fuentes secundarias

on:
  # mapainversiones.gob.do y hacienda.gob.do responden 403 a IPs de centros de datos (verificado
  # 2026-11-09 desde GitHub Actions). Esas dos fuentes corren solo en un runner autoalojado con la
  # etiqueta `tirds-residencial` (variable SELF_HOSTED_SECONDARY=true) o con scripts/sync-local.sh.
  schedule:
    - cron: "30 5 * * *"     # MapaInversiones (publica ~03:40 UTC)
    - cron: "0 14 * * 1-5"   # BCRD tasa de cambio
    - cron: "0 6 * * 1"      # Hacienda (CKAN) + verificación Transparencia Fiscal
  workflow_dispatch:
    inputs:
      source:
        description: "mapainversiones | bcrd | hacienda | transparencia-fiscal | todas"
        default: todas
        required: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ${{ vars.SELF_HOSTED_SECONDARY == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Elegir fuentes
        id: pick
        run: |
          S="${{ github.event.inputs.source }}"
          case "${{ github.event.schedule }}" in
            "30 5 * * *") S=mapainversiones ;;
            "0 14 * * 1-5") S=bcrd ;;
            "0 6 * * 1") S="hacienda transparencia-fiscal" ;;
          esac
          [ "$S" = "todas" ] && S="bcrd mapainversiones hacienda transparencia-fiscal"
          if [ "${{ vars.SELF_HOSTED_SECONDARY }}" != "true" ]; then
            # En runners de GitHub solo se consultan las fuentes que no bloquean centros de datos.
            S=$(echo "$S" | tr ' ' '\n' | grep -vE '^(mapainversiones|hacienda)$' | tr '\n' ' ')
          fi
          echo "sources=$S" >> "$GITHUB_OUTPUT"
      - name: Sincronizar
        run: |
          status=0
          for src in ${{ steps.pick.outputs.sources }}; do
            echo "::group::$src"
            uv run tirds sync "$src" --trigger "${{ github.event_name }}" || status=1
            echo "::endgroup::"
          done
          exit $status
